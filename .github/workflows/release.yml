name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        working-directory: flutter
        run: |
          flutter pub get
          flutter build apk --release

      - name: Package Python brain and firmware
        run: |
          zip -r brain.zip build_dataset.py main.py test.py camera.py iframe_embeded.py README.md
          zip -r firmware.zip arduino

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            flutter/build/app/outputs/flutter-apk/app-release.apk
            brain.zip
            firmware.zip